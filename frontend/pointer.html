<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SenseMate 포인팅 데모</title>
  <link rel="stylesheet" href="pointer.css" />
</head>
<body>
  <!-- 영상은 화면에 보이지 않는다. 인식용으로만 쓴다 -->
  <video id="video" autoplay playsinline muted></video>

  <aside id="panel">
    <h1>SenseMate <a href="/">대시보드 →</a></h1>

    <div class="block">
      <canvas id="hand-canvas" width="300" height="225"></canvas>
      <div class="hands">
        <div class="hand-card" id="card-left">
          <span class="dot left"></span>왼손 <b id="pose-left">인식 안 됨</b>
        </div>
        <div class="hand-card" id="card-right">
          <span class="dot right"></span>오른손 <b id="pose-right">인식 안 됨</b>
        </div>
      </div>
    </div>

    <div class="block" id="voice-block">
      <div class="voice-state" id="voice-state">꺼짐</div>
      <p class="hint">"<b id="wake-name"></b>"라고 부르면 명령을 들을 준비를 합니다</p>
      <p class="transcript" id="transcript">&nbsp;</p>
      <p class="reply" id="reply">&nbsp;</p>
    </div>

    <div class="block">
      <h2>사용 방법</h2>
      <ol>
        <li>검지만 펴서 가리키면 커서가 움직입니다</li>
        <li>엄지와 검지를 붙이면(집기) 그 위치를 선택합니다</li>
        <li>손바닥을 펴면 비서가 말을 멈춥니다</li>
      </ol>
    </div>

    <div class="block">
      <h2>기록</h2>
      <ul id="log"></ul>
    </div>

    <button id="start-btn">시작 (카메라와 마이크)</button>
    <p id="status"></p>
  </aside>

  <main id="stage">
    <div class="tile" data-command="오늘 할 일 알려줘">📋<span>할 일 보기</span></div>
    <div class="tile" data-command="안녕">👋<span>인사하기</span></div>
    <div class="tile">📝<span>메모</span></div>
    <div class="tile">🎵<span>음악</span></div>
    <div class="tile">☀️<span>날씨</span></div>
    <div class="tile">⚙️<span>설정</span></div>
    <div class="cursor left" id="cursor-left"></div>
    <div class="cursor right" id="cursor-right"></div>
  </main>

  <script type="module" src="js/pointer-demo.js"></script>
</body>
</html>
